name: Build Hesabati Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Package live update bundle
        run: cd www && zip -qr ../hesabati-web.zip .
      - name: Publish live update bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}
          name: Hesabati live update ${{ github.run_number }}
          files: hesabati-web.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish live update manifest
        run: |
          cat > ota-manifest.json <<'EOF'
          {
            "version": "${{ github.run_number }}",
            "url": "https://github.com/mustshar2017-debug/hesabati/releases/download/ota-${{ github.run_number }}/hesabati-web.zip"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish app live update manifest"
            git push origin HEAD:mobile-app
          fi
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install approved launcher icon
        run: node scripts/install-android-icon.mjs
      - name: Configure reliable Maven Central mirror
        run: |
          for file in android/settings.gradle android/build.gradle android/app/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's#mavenCentral()#maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()#g' "$file"
            fi
          done
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
