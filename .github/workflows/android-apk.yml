name: Build Hesabati Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Install approved launcher icon
        run: node scripts/install-android-icon.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure reliable Maven Central mirror
        run: |
          for file in android/settings.gradle android/build.gradle android/app/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's#mavenCentral()#maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()#g' "$file"
            fi
          done
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
