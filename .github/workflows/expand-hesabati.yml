name: Expand Hesabati HTML
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expand-hesabati.yml"
      - "scripts/expand_hesabati.py"
permissions:
  contents: read
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Decompress and prepare standalone app
        run: python scripts/expand_hesabati.py
